name: Build iXGAME from RAW

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout iXGAME
        uses: actions/checkout@v4

      - name: Download RAW project
        run: |
          curl -L \
            https://github.com/rawgame4/rawgame4.github.io/archive/refs/heads/main.zip \
            -o raw.zip
          mkdir raw
          unzip -q raw.zip -d raw

      - name: Extract RAW files
        run: |
          RAW_DIR=$(find raw -maxdepth 1 -type d -name 'rawgame4.github.io-*' | head -n 1)

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'iXGAME.io-custom-site.zip' \
            -exec rm -rf {} +

          cp -a "$RAW_DIR/." .

      - name: Extract iXGAME customization
        run: |
          mkdir custom
          unzip -q iXGAME.io-custom-site.zip -d custom

          cp -f custom/index.html ./index.html
          cp -f custom/cache.appcache ./cache.appcache
          cp -f custom/ixgame-banner.png ./ixgame-banner.png

      - name: Commit built website
        run: |
          git config user.name "iXGAME Bot"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Build iXGAME site from RAW"
            git push
          fi
