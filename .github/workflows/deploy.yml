name: Build iXGAME

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout iXGAME
        uses: actions/checkout@v4

      - name: Extract iXGAME ZIP
        run: |
          set -e

          rm -rf build
          mkdir -p build

          ZIP="iXGAME-from-scratch.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP" -d build

          echo "ZIP extracted."

      - name: Get RawGame static resources
        run: |
          set -e

          rm -rf rawgame
          git clone --depth 1 \
            https://github.com/rawgame4/rawgame4.github.io.git \
            rawgame

          mkdir -p build/assets/rawgame

          # Static image/resource only.
          # RawGame interface and executable exploit files are not copied.
          if [ -f rawgame/logo_raw.png ]; then
            cp rawgame/logo_raw.png build/assets/rawgame/
          fi

          echo "Static resources copied."

      - name: Verify new website
        run: |
          set -e

          test -f build/index.html

          echo "=============================="
          echo "iXGAME website ready"
          echo "=============================="

          find build -maxdepth 3 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
