name: Build iXGAME from RAW

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout iXGAME
        uses: actions/checkout@v4

      - name: Download RAW project
        run: |
          curl -L --fail \
            https://github.com/rawgame4/rawgame4.github.io/archive/refs/heads/main.zip \
            -o raw.zip

          mkdir raw
          unzip -q raw.zip -d raw

      - name: Copy RAW files
        run: |
          RAW_DIR=$(find raw -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$RAW_DIR" ]; then
            echo "RAW directory was not found"
            exit 1
          fi

          echo "Using RAW directory: $RAW_DIR"

          cp -a "$RAW_DIR/." ./

          rm -rf raw raw.zip

      - name: Apply iXGAME customization
        run: |
          rm -rf custom
          mkdir custom

          unzip -q iXGAME.io-custom-site.zip -d custom

          cp -f custom/index.html ./index.html
          cp -f custom/cache.appcache ./cache.appcache
          cp -f custom/ixgame-banner.png ./ixgame-banner.png

      - name: Commit built website
        run: |
          git config user.name "iXGAME Bot"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Build iXGAME site from RAW"
            git push
          fi
