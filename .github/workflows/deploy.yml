name: Sync RAW + iXGAME

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout iXGAME repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download RAW
        run: |
          set -e

          rm -rf raw raw.zip

          curl -L --fail --retry 3 \
            https://github.com/rawgame4/rawgame4.github.io/archive/refs/heads/main.zip \
            -o raw.zip

          mkdir raw
          unzip -q raw.zip -d raw

          RAW_DIR=$(find raw -mindepth 1 -maxdepth 1 -type d | head -n 1)

          echo "RAW_DIR=$RAW_DIR" >> "$GITHUB_ENV"

      - name: Save iXGAME interface
        run: |
          set -e

          mkdir -p /tmp/ixgame

          # احفظ واجهة iXGAME الموجودة في المستودع
          if [ -f index.html ]; then
            cp index.html /tmp/ixgame/index.html
          fi

          # احفظ ملفات CSS/JS والصور الخاصة بواجهة iXGAME
          find . -maxdepth 2 -type f \
            \( -name "*.css" -o -name "*.png" -o -name "*.jpg" \
            -o -name "*.jpeg" -o -name "*.webp" -o -name "*.gif" \
            -o -name "*.svg" \) \
            -not -path "./.git/*" \
            -not -path "./raw/*" \
            -exec cp -f {} /tmp/ixgame/ \; || true

      - name: Update repository from RAW
        run: |
          set -e

          echo "Updating repository..."

          # لا نحذف .git أو مجلد workflow
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "raw" \
            ! -name "raw.zip" \
            -exec rm -rf {} +

          # نسخ ملفات RAW العامة إلى جذر المستودع
          # مع استبعاد واجهة RAW القديمة.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='index.html' \
            --exclude='run_lapse.html' \
            --exclude='run_poops.html' \
            --exclude='README.md' \
            "$RAW_DIR"/ ./

      - name: Restore iXGAME interface
        run: |
          set -e

          if [ -f /tmp/ixgame/index.html ]; then
            cp -f /tmp/ixgame/index.html ./index.html
          else
            echo "ERROR: iXGAME index.html was not found."
            exit 1
          fi

          # استعادة موارد واجهة iXGAME
          for file in /tmp/ixgame/*; do
            [ -f "$file" ] || continue

            name=$(basename "$file")

            if [ "$name" != "index.html" ]; then
              cp -f "$file" "./$name"
            fi
          done

      - name: Show final repository
        run: |
          echo "===== FINAL REPOSITORY ====="
          find . -maxdepth 2 -type f \
            -not -path "./.git/*" \
            | sort

      - name: Commit and push
        run: |
          set -e

          git config user.name "iXGAME Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Sync RAW resources and update iXGAME interface"
            git push origin HEAD:main
          fi
