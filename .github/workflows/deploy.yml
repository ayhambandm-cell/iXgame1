name: Build iXGAME

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout iXGAME
        uses: actions/checkout@v4

      - name: Clone RAW Game
        run: |
          set -e

          rm -rf raw
          git clone --depth 1 \
            https://github.com/rawgame4/rawgame4.github.io.git \
            raw

          echo "RAW repository:"
          ls -la raw

      - name: Build website
        run: |
          set -e

          rm -rf site
          mkdir -p site

          echo "Copying selected RAW files..."

          # ملفات الموارد المطلوبة
          cp -f raw/int64.js site/int64.js
          cp -f raw/ps4_offsets.js site/ps4_offsets.js
          cp -f raw/rpc_worker.js site/rpc_worker.js

          # سلاسل التشغيل
          cp -f raw/chain_lapse.js site/chain_lapse.js
          cp -f raw/chain_poops.js site/chain_poops.js

          # Payload
          cp -f raw/payload.bin site/payload.bin

          # مجلد patches
          if [ -d raw/patches ]; then
            cp -a raw/patches site/patches
          fi

          # واجهة الموقع
          if [ -f index.html ]; then
            cp -f index.html site/index.html
          elif [ -f raw/index.html ]; then
            cp -f raw/index.html site/index.html
          else
            echo "ERROR: index.html not found"
            exit 1
          fi

          # صفحات الواجهة
          for file in run_lapse.html run_poops.html; do
            if [ -f "$file" ]; then
              cp -f "$file" "site/$file"
            elif [ -f "raw/$file" ]; then
              cp -f "raw/$file" "site/$file"
            fi
          done

          echo ""
          echo "===== FINAL SITE ====="
          find site -maxdepth 2 -type f | sort

      - name: Verify required files
        run: |
          set -e

          required=(
            index.html
            int64.js
            ps4_offsets.js
            rpc_worker.js
            chain_lapse.js
            chain_poops.js
            payload.bin
          )

          for file in "${required[@]}"; do
            if [ ! -f "site/$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi

            echo "OK: $file"
          done

          if [ -d site/patches ]; then
            echo "OK: patches/"
          else
            echo "WARNING: patches/ not found"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
