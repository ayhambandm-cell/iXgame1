      - name: Apply iXGAME customization
        run: |
          set -e
          echo "ZIP contents:"
          unzip -l iXGAME.io-custom-site.zip
          rm -rf custom
          mkdir -p custom
          unzip -q iXGAME.io-custom-site.zip -d custom
          echo "Extracted files:"
          find custom -type f -maxdepth 5 -print
          # ابحث عن الملفات مهما كان المجلد الموجود داخل ZIP
          INDEX=$(find custom -type f -name "index.html" | head -n 1)
          CACHE=$(find custom -type f -name "cache.appcache" | head -n 1)
          BANNER=$(find custom -type f -name "ixgame-banner.png" | head -n 1)
          # index.html
          if [ -n "$INDEX" ]; then
            cp -f "$INDEX" ./index.html
            echo "index.html copied"
          else
            echo "ERROR: index.html was not found inside ZIP"
            exit 1
          fi
          # cache.appcache اختياري
          if [ -n "$CACHE" ]; then
            cp -f "$CACHE" ./cache.appcache
            echo "cache.appcache copied"
          fi
          # صورة البانر اختيارية
          if [ -n "$BANNER" ]; then
            cp -f "$BANNER" ./ixgame-banner.png
            echo "ixgame-banner.png copied"
          fi
